services:
  db:
    image: postgres:15
    container_name: nem-postgres
    environment:
      POSTGRES_USER: nemuser
      POSTGRES_PASSWORD: nempass
      POSTGRES_DB: nemdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: nem-reader
    depends_on:
      - db
    environment:
      DOCKER: true
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nemdb
      DB_USER: nemuser
      DB_PASSWORD: nempass
      FLYWAY_MIX: false
    stdin_open: true
    tty: true

volumes:
  postgres-data:
